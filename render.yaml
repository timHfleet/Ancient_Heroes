# Slug stays ikigai-saga so the existing Render service and URL keep working.
# Rename the display name in the Render dashboard if you want it to read Ancient Heroes.
services:
  - type: web
    name: ikigai-saga
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
